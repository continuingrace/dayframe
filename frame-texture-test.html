<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dayframe Frame Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#20211f;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.top h1{font-size:22px;margin:0}.tag{font-size:12px;color:#777}.card{background:#fffdf8;border:1px solid #ddd8ce;border-radius:24px;padding:18px}.sheet{background:#fbfaf5;padding:18px;border-radius:8px}.header{display:flex;gap:12px;margin-bottom:14px}.field{height:38px;flex:1;position:relative}.field.small{flex:.58}.art{height:390px;position:relative;margin-bottom:14px;background:#f1eee5}.note{height:150px;position:relative}.stroke{position:absolute;inset:0;pointer-events:none}.line{position:absolute;left:18px;right:18px;height:1px;background:#4c4942;opacity:.62}.l1{top:42px}.l2{top:82px}.l3{top:122px}.sample{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}.controls{margin-top:18px;display:grid;gap:14px}.row{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center}.row label{font-size:13px;font-weight:650}.row output{font-size:12px;color:#777;text-align:right}input[type=range]{width:100%}.hint{font-size:13px;line-height:1.6;color:#777;margin:16px 2px 0}.badge{display:inline-block;margin-top:14px;padding:7px 10px;border-radius:999px;background:#ebe7dc;font-size:12px}canvas{width:100%;height:100%;display:block}
</style></head><body><div class="wrap"><div class="top"><h1>Frame Stroke Test</h1><span class="tag">V34 유지 · isolated preview</span></div><div class="card"><div class="sheet"><div class="header"><div class="field"><canvas data-shape="rect"></canvas></div><div class="field small"><canvas data-shape="rect"></canvas></div></div><div class="art"><div class="sample">그림 영역 — 원고지 칸 없음</div><canvas data-shape="rect"></canvas></div><div class="note"><canvas data-shape="rect"></canvas><i class="line l1"></i><i class="line l2"></i><i class="line l3"></i></div></div><div class="controls"><div class="row"><label>질감 Threshold</label><input id="rough" type="range" min="0" max="100" value="68"><output id="roughO">68</output></div><div class="row"><label>필압 편차</label><input id="pressure" type="range" min="0" max="100" value="34"><output id="pressureO">34</output></div><div class="row"><label>라인 농도</label><input id="dark" type="range" min="0" max="100" value="82"><output id="darkO">82</output></div><div class="row"><label>기본 굵기</label><input id="width" type="range" min="2" max="8" step=".2" value="4.6"><output id="widthO">4.6</output></div></div><span class="badge">추천 시작값: 68 / 34 / 82 / 4.6</span><p class="hint">전체 사각형은 반듯하게 유지하고, 선의 가장자리만 미세하게 울퉁불퉁하도록 만든 테스트입니다. 뾰족한 지그재그나 원고지 칸은 넣지 않았습니다.</p></div></div><script>
const $=s=>document.querySelector(s),all=[...document.querySelectorAll('canvas')];function rnd(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}function seg(ctx,x1,y1,x2,y2,seed){const R=+$("[id=rough]").value/100,P=+$("[id=pressure]").value/100,D=+$("[id=dark]").value/100,W=+$("[id=width]").value;const len=Math.hypot(x2-x1,y2-y1),n=Math.max(18,Math.round(len/7)),nx=-(y2-y1)/len,ny=(x2-x1)/len;ctx.lineCap="round";ctx.lineJoin="round";for(let pass=0;pass<2;pass++){ctx.beginPath();for(let i=0;i<=n;i++){const t=i/n,baseX=x1+(x2-x1)*t,baseY=y1+(y2-y1)*t;const wave=Math.sin(t*19+seed)*.42+Math.sin(t*43+seed*1.7)*.18;const grain=(rnd(seed*97+i*13+pass*31)-.5)*1.25;const off=(wave+grain)*R*2.0;const x=baseX+nx*off,y=baseY+ny*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`rgba(45,43,39,${.54+D*.4-(pass*.16)})`;ctx.lineWidth=W*(1+(Math.sin(seed+tSeed(seed,pass))*P*.08))-(pass*.9);ctx.stroke()}}function tSeed(a,b){return Math.sin(a*2.7+b*1.9)}function draw(c,k){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p=3;seg(x,p,p,w-p,p,k+1);seg(x,w-p,p,w-p,h-p,k+2);seg(x,w-p,h-p,p,h-p,k+3);seg(x,p,h-p,p,p,k+4)}function render(){all.forEach((c,i)=>draw(c,31+i*11));["rough","pressure","dark","width"].forEach(id=>$("#"+id+"O").textContent=$("#"+id).value)}["rough","pressure","dark","width"].forEach(id=>$("#"+id).addEventListener("input",render));addEventListener("resize",render);render();
</script></body></html>

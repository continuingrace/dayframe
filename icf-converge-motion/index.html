<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0f24; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html"
           data-start="0" data-duration="15" data-track-index="0" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html"
           data-start="0" data-duration="2.6" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html"
           data-start="2.6" data-duration="2.9" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html"
           data-start="5.5" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html"
           data-start="9.1" data-duration="3" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html"
           data-start="12.1" data-duration="2.9" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html"
           data-start="0" data-duration="15" data-track-index="2" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:3"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

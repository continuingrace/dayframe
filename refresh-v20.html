<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Dayframe V20 업데이트</title><style>body{margin:0;background:#f6f3ec;color:#20211f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;display:grid;min-height:100vh;place-items:center}.box{width:min(86vw,420px);padding:28px;border:1px solid #d9d5cb;border-radius:22px;background:#fffdf8;text-align:center}h1{font-size:24px;margin:0 0 12px}p{font-size:14px;line-height:1.65;color:#77766f;margin:0}.ok{margin-top:18px;font-weight:700;color:#20211f}</style></head><body><div class="box"><h1>Dayframe V20 업데이트</h1><p>기존 화면 캐시만 정리하고 최신 Dayframe을 다시 불러옵니다.<br>로컬에 저장한 캐릭터·기록 데이터는 삭제하지 않습니다.</p><p class="ok" id="status">업데이트 준비 중…</p></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('dayframe-')).map(k=>caches.delete(k)))}s.textContent='완료. 최신 버전을 여는 중…';setTimeout(()=>location.replace('./?v=20&t='+Date.now()),700)}catch(e){s.textContent='최신 버전을 여는 중…';setTimeout(()=>location.replace('./?v=20&t='+Date.now()),700)}})();</script></body></html>
